FileVersion = 1
Unlocked = ["corlib"]
ExtraPlatforms = ["Win64"]

[Workspace]
StartupProject = "Leaf"

[[Workspace.DistinctOptions]]
Filter = ""

[Projects]
Leaf = {Path = "."}
ImGui = "*"
ImGui = {Path = "../imgui-beef"}
BJSON = {Path = "../BJSON"}
raylib-beef = {Path = "../raylib-beef/raylib-beef"}
TinySoundFontBeef = {Path = "../TinySoundFontBeef"}
Jolt = {Path = "../JoltCBeef"}
rlCImGuiBeef = {Path = "../rlCImGuiBeef"}
raylib-aseprite-beef = {Path = "../raylib-aseprite-beef"}

[WorkspaceFolders]
Libs = ["corlib", "ImGui", "BJSON", "raylib-beef", "TinySoundFontBeef", "Jolt", "rlCImGuiBeef", "raylib-aseprite-beef"]

[Configs.Debug.wasm32]
AllocType = "CRT"
EnableObjectDebugFlags = false
EmitObjectAccessCheck = false
